name: magma-orbs

services:
  magma:
    image: magma:1.4.0
    build:
      context: ./scripts
      args:
        MAGMA_REVISION: ${MAGMA_REVISION:-unknown}
    container_name: magma
    hostname: magma
    init: true
    ports:
      - "${MAGMA_BIND_ADDRESS:-0.0.0.0}:${MAGMA_PUBLIC_PORT:-3100}:3100"
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: volume
        source: magma-data
        target: /data
    environment:
      MAGMA_HOST: 0.0.0.0
      MAGMA_PORT: "3100"
      MAGMA_DATA: /data
      MAGMA_STACKS: /data/stacks
      MAGMA_CONTAINER_NAME: magma
      MAGMA_MAX_N: ${MAGMA_MAX_N:-32}
    labels:
      io.magma.managed: "true"
      io.magma.protected: "true"
      io.magma.component: control-plane
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3100/api/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  magma-data:
    name: ${MAGMA_VOLUME_NAME:-magma-data}
    labels:
      io.magma.managed: "true"
      io.magma.protected: "true"
