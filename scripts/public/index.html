<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
  <canvas id="world"></canvas>
  <div id="heat"></div>

  <header class="top">
    <div class="brand">
      <span class="logo">●</span>
      <div>
        <strong>MAGMA</strong>
        <em>plantilla → N run</em>
      </div>
    </div>
    <nav class="filters">
      <button data-filter="all" class="on">todo</button>
      <button data-filter="container">contenedores</button>
      <button data-filter="image">imágenes</button>
      <button data-filter="stack">stacks</button>
    </nav>
    <div class="stats">
      <span id="stat-c">0 c</span>
      <span id="stat-i">0 img</span>
      <span id="stat-s">0 yml</span>
      <span id="ws" class="off">ws</span>
    </div>
  </header>

  <aside class="dock">
    <button id="btn-refresh" title="refrescar">↻</button>
    <button id="btn-run" title="correr imagen">＋</button>
    <button id="btn-stack" title="nuevo compose">▤</button>
    <button id="btn-auto" title="commit automático">◎</button>
    <button id="btn-evolve" title="evolucionar contenedor">🧬</button>
    <button id="btn-stamp" title="stamp: exec + 1 commit + N run">×</button>
    <button id="btn-bake" title="build Dockerfile + N run">△</button>
  </aside>

  <div id="radial" class="hidden">
    <button data-act="commit">commit</button>
    <button data-act="dup">duplicar</button>
    <button data-act="evolve">evolucionar</button>
    <button data-act="start">start</button>
    <button data-act="stop">stop</button>
    <button data-act="run">correr</button>
    <button data-act="stamp">×N</button>
    <button data-act="spawn">×N img</button>
    <button data-act="edit">editar</button>
    <button data-act="up">up</button>
    <button data-act="down">down</button>
    <button data-act="inspect">ver</button>
    <button data-act="rm" class="danger">borrar</button>
  </div>

  <section id="panel" class="hidden">
    <header>
      <h2 id="panel-title">detalle</h2>
      <button id="panel-close">✕</button>
    </header>
    <pre id="panel-body"></pre>
  </section>

  <section id="modal" class="hidden">
    <form id="form">
      <h2 id="form-title">nuevo</h2>
      <label>nombre <input name="name" autocomplete="off" /></label>
      <label>imagen / repo:tag <input name="image" placeholder="debian:bookworm-slim" /></label>
      <label>mensaje commit <input name="message" placeholder="apt listo, snapshot N" /></label>
      <label class="full" id="yaml-label">yaml
        <textarea name="yaml" rows="12" spellcheck="false"></textarea>
      </label>
      <div class="row">
        <button type="button" id="form-cancel">cancelar</button>
        <button type="submit">hacer</button>
      </div>
    </form>
  </section>

  <div id="toast"></div>
  <p id="hint">arrastrá los orbes · click para el menú · doble click inspecciona</p>

  <script type="module" src="/public/js/app.js"></script>
</body>
</html>
